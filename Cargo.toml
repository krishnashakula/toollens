[package]
name = "toollens"
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
description = "MCP gateway that shows an agent the few tools it needs from a catalog of thousands"
license = "MIT"
repository = "https://github.com/krishnashakula/toollens"
readme = "README.md"
keywords = ["mcp", "ai-agents", "llm", "gateway", "claude"]
categories = ["command-line-utilities", "development-tools"]
# bench/ (28 MB of transcripts) and demo/ stay on GitHub.
# Anchored: `include` overrides .gitignore, and unanchored names also match inside demo/node_modules.
include = ["/src/**", "/examples/*.json", "/README.md", "/LICENSE"]

[dependencies]
rmcp = { version = "3.7", features = ["server", "client", "transport-io", "transport-child-process"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.41", features = ["bundled"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
jsonschema = { version = "0.60", default-features = false }
reqwest = { version = "0.13", features = ["json"] }
axum = "0.8"

[dev-dependencies]
tempfile = "3"
