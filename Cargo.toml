[package]
name = "toollens"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "MCP gateway that shows an agent the few tools it needs from a catalog of thousands"
license = "MIT"

[dependencies]
rmcp = { version = "3.7", features = ["server", "client", "transport-io", "transport-child-process"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.41", features = ["bundled"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
jsonschema = { version = "0.60", default-features = false }
reqwest = { version = "0.13", features = ["json"] }
axum = "0.8"

[dev-dependencies]
tempfile = "3"
